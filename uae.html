<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한-UAE CEPA 협정 세율 조회 — TROPS</title>
<meta name="description" content="HS 8단위로 한-UAE CEPA 부속서의 양허 내용과 연도별 적용 세율을 조회합니다. 무료 · 로그인 없이 이용할 수 있습니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  /* ============================================================
     아래 "상속 CSS" 블록은 index.html <style>에서 그대로 옮긴 사본입니다.
     (정적 사이트라 빌드 단계가 없어 공유 스타일시트를 만들지 않았습니다.)
     index.html 쪽을 고치면 이쪽도 함께 맞춰야 합니다.
     ============================================================ */
  :root {
    --ink:          #0F172A;
    --ink-70:       rgba(15, 23, 42, .7);
    --ink-64:       rgba(15, 23, 42, .64);
    --ink-62:       rgba(15, 23, 42, .62);
    --accent:       #0F172A;
    --accent-press: #1E293B;
    --muted:        #94A3B8;
    --line:         #E2E8F0;
    --surface:      #F8FAFC;
    --bg:           #FFFFFF;
    --warning:      #DC2626;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 16.5px;
    line-height: 1.76;
    word-break: keep-all;
    text-wrap: pretty;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--ink); }

  ::selection { background: rgba(15, 23, 42, .14); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .container { max-width: 1200px; margin: 0 auto; padding-inline: clamp(24px, 5vw, 64px); }

  /* ---------- Skip link ---------- */
  .skip {
    position: absolute;
    left: 16px;
    top: 16px;
    transform: translateY(-160%);
    background: var(--ink);
    color: #FFFFFF;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    z-index: 100;
    transition: transform .15s ease;
  }
  .skip:focus { transform: translateY(0); color: #FFFFFF; }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner { height: 64px; display: flex; align-items: center; gap: 40px; }
  .wordmark {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-62);
    transition: color .14s ease;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  /* 앵커 이동 시 sticky .nav(64px)에 목표 지점이 가리지 않도록 */
  #uae-main { scroll-margin-top: 84px; }
  #uae-main:focus { outline: none; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 46px;
    padding: 0 22px;
    border-radius: 6px;
    border: 0;
    font: inherit;
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .14s ease, border-color .14s ease;
  }
  .btn-primary { background: var(--accent); color: #FFFFFF; }
  .btn-primary:hover { background: var(--accent-press); color: #FFFFFF; }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .btn-secondary:hover { border-color: var(--muted); color: var(--ink); }
  .btn-nav { height: 36px; padding: 0 16px; font-size: 14.5px; }

  /* ---------- Badge ---------- */
  .wf-badge {
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--accent);
    border: 1px solid rgba(15, 23, 42, .28);
    border-radius: 4px;
    padding: 2px 7px;
  }

  /* ---------- HS lookup (index.html Hero 조회 블록과 동일) ---------- */
  .hs-box { margin-top: 30px; max-width: 468px; }
  .hs-box-label {
    margin: 0 0 10px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--ink);
  }
  .hs-group {
    display: flex;
    align-items: stretch;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
  }
  .hs-group:focus-within { border-color: var(--muted); }
  .hs-country {
    display: flex;
    align-items: center;
    padding: 0 14px;
    margin-right: 5px;
    border-right: 1px solid var(--line);
    font-size: 15.5px;
    font-weight: 500;
    color: var(--ink-70);
    white-space: nowrap;
  }
  .hs-group input {
    flex: 1 1 auto;
    min-width: 0;
    height: 42px;
    border: 0;
    background: transparent;
    padding: 0 6px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
  }
  .hs-group input:focus { outline: none; }
  .hs-group input::placeholder { color: var(--muted); }
  .hs-group .btn { flex: 0 0 auto; height: 42px; padding: 0 20px; }
  .hs-meta { margin: 10px 0 0; font-size: 13.5px; line-height: 1.65; color: var(--muted); }

  @media (max-width: 640px) {
    .nav-links { display: none; }
    .hs-box { max-width: none; }
    .hs-group { flex-wrap: wrap; }
    .hs-country {
      width: 100%;
      margin: 0 0 5px;
      padding: 6px 8px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .hs-group input { flex: 1 1 110px; padding-left: 8px; }
  }

/* ============================================================
   /uae 조회 결과 — 신규 CSS
   index.html <style> 블록 맨 아래에 그대로 붙여넣을 수 있습니다.
   새 색상/폰트/radius 없음. 그라데이션·그림자·신규 애니메이션 없음.
   반응형은 컨테이너 쿼리(.uae-page)로 처리 — 기존 미디어쿼리와 충돌 없음.
   ============================================================ */
.uae-page{container-type:inline-size;background:var(--bg)}
.uae-main{display:block}

/* --- 다시 조회 --- */
.uae-topbar{padding-block:20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.uae-back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--ink-62)}
.uae-back:hover{color:var(--ink)}
.uae-back-mark{font-size:15px;line-height:1}

/* --- 1. 조회한 품목 헤더 --- */
.uae-head{padding-block:26px 32px;border-bottom:1px solid var(--line)}
.uae-head-kicker{margin:0 0 14px;font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.uae-hs{display:flex;align-items:baseline;font-size:30px;font-weight:600;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;line-height:1.2}
.uae-hs-g{display:inline-block}
.uae-hs-g + .uae-hs-g{margin-left:.34em}
.uae-hs-note{margin:8px 0 0;font-size:12.5px;letter-spacing:.02em;color:var(--muted);
  font-variant-numeric:tabular-nums}
.uae-item-name{margin:14px 0 0;font-size:21px;line-height:1.4;font-weight:700;letter-spacing:-0.02em;max-width:34ch}
.uae-item-parent{margin:4px 0 0;font-size:14.5px;color:var(--ink-64)}
.uae-badge-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.uae-badge-quiet{color:var(--ink-64);border-color:var(--line)}
/* 경고색은 금지품목(PH)에만 사용합니다. 양허제외(X)는 중립 .wf-badge를 씁니다. */
.uae-badge-warning{color:var(--warning);border-color:rgba(220,38,38,.34)}

/* --- 2. 세율 카드 3개 --- */
.uae-rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-block:28px 4px}
.uae-rate{border:1px solid var(--line);border-radius:8px;padding:20px 22px 18px;background:var(--bg)}
.uae-rate-now{background:var(--surface)}
.uae-rate-label{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--ink-62)}
.uae-rate-value{margin:8px 0 0;font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-0.01em;
  font-variant-numeric:tabular-nums}
.uae-rate-value-na{font-size:19px;font-weight:600;letter-spacing:0;color:var(--muted)}
.uae-rate-src{margin:14px 0 0;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.6;color:var(--muted)}

/* --- 블록 공통 --- */
.uae-block{padding-block:32px;border-top:1px solid var(--line)}
.uae-block-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.uae-block-title{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-0.01em}
.uae-block-src{font-size:12.5px;line-height:1.6;color:var(--muted)}
.uae-block-note{margin:10px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink-64);max-width:60ch}

/* --- 3. 연도별 세율 표 --- */
.uae-table-wrap{margin-top:20px;max-width:430px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.uae-table{width:100%;border-collapse:collapse}
.uae-table th{text-align:left;background:var(--surface);font-size:12px;font-weight:700;letter-spacing:.08em;
  color:var(--ink-62);padding:9px 18px;border-bottom:1px solid var(--line)}
.uae-table th:last-child,.uae-table td:last-child{text-align:right}
.uae-table td{padding:10px 18px;font-size:15.5px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;color:var(--ink-70)}
.uae-table tr:last-child td{border-bottom:0}
.uae-table .uae-row-current td{background:var(--surface);color:var(--ink);font-weight:600}
.uae-row-mark{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-left:8px}

/* --- 4. 원산지 결정기준(PSR) --- */
.uae-psr{margin-top:20px;border:1px solid var(--line);border-radius:8px;padding:20px 22px;background:var(--surface)}
.uae-psr-pending{background:var(--bg);border-style:dashed}
.uae-psr-state{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
  letter-spacing:.08em;color:var(--ink-62)}
.uae-psr-mark{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.uae-psr-mark-pending{background:transparent;border:1.5px solid var(--muted)}
.uae-psr-text{margin:10px 0 0;font-size:16.5px;line-height:1.76;max-width:56ch}
.uae-psr-text-pending{color:var(--ink-64)}
.uae-psr-meta{margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.6;color:var(--muted)}

/* --- 5. 확인 항목 · 진단서 전환 --- */
.uae-check{padding-block:34px 38px;border-top:1px solid var(--line)}
.uae-check-count{margin:0;font-size:24px;line-height:1.34;font-weight:700;letter-spacing:-0.025em}
.uae-check-sub{margin:10px 0 0;font-size:16.5px;line-height:1.76;color:var(--ink-64);max-width:50ch}
.uae-check-list{margin:22px 0 0;padding:0;list-style:none;display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 28px;max-width:760px}
.uae-check-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:baseline;font-size:15px}
.uae-check-num{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.uae-check-cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:28px}
/* 진단서 신청 오픈 전 비활성 상태 — 새 색 없이 면(--surface)·선(--line)·--muted 로만 */
.uae-check-cta .btn:disabled{background:var(--surface);border:1px solid var(--line);
  color:var(--muted);cursor:not-allowed}
.uae-check-cta-note{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:34ch}

/* --- 7. Footer · 사업자정보 (전 페이지 공통) ---
   6개 항목의 표기는 사업자등록증·통신판매업신고증 원문과 글자 그대로 일치해야 합니다.
   "주식회사 테오네"를 "(주)테오네"로 줄여 쓰지 마십시오. */
.footer{border-top:1px solid var(--line)}
.footer-inner{padding-block:32px 28px}
.footer-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.footer-mark{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.footer-meta{font-size:13.5px;color:var(--muted)}
.footer-links{margin:18px 0 0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.footer-links a{color:var(--ink-64)}
.footer-biz{margin:16px 0 0;display:grid;gap:3px;font-size:12.5px;line-height:1.7;color:var(--muted)}
.footer-biz>div{display:flex;flex-wrap:wrap;gap:4px 10px}
.footer-biz dt{flex:0 0 auto;min-width:116px;margin:0}
.footer-biz dd{margin:0}
.footer-legal{margin:18px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.footer-legal p{margin:0}

/* --- 6. 면책 문구 — 하단 고정 --- */
.uae-disclaimer{position:sticky;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line)}
.uae-disclaimer-inner{padding-block:20px 22px}
.uae-disclaimer p{margin:0;font-size:13px;line-height:1.78;color:var(--ink-64);max-width:82ch}

/* --- 좁은 폭 --- */
@container (max-width:680px){
  .uae-hs{font-size:25px}
  .uae-item-name{font-size:19px}
  .uae-rates{grid-template-columns:1fr;gap:10px;padding-block:24px 0}
  .uae-rate{padding:16px 18px 15px}
  .uae-rate-value{font-size:29px}
  .uae-block{padding-block:28px}
  .uae-table-wrap{max-width:none}
  .uae-check-count{font-size:21px}
  .uae-check-list{grid-template-columns:1fr}
  .uae-check-cta{gap:12px}
  .uae-check-cta .btn{width:100%}
  .uae-disclaimer p{font-size:12.5px}
}
</style>
</head>
<body>
  <a href="#uae-main" class="skip">본문으로 건너뛰기</a>

  <div class="uae-page">
    <nav class="nav">
      <div class="container nav-inner">
        <a href="/" class="wordmark" aria-label="TROPS 홈">TROPS</a>
        <div class="nav-links">
          <a href="/#how">작동 방식</a>
          <a href="/#stages">이용 단계</a>
          <a href="/#interest">문의</a>
        </div>
        <div class="nav-right">
          <a class="btn btn-secondary btn-nav" href="https://app.trops.kr/" target="_self">수출 시작하기</a>
        </div>
      </div>
    </nav>

    <main class="uae-main" id="uae-main" tabindex="-1">
      <noscript>
        <div class="container uae-block" style="border-top:0">
          <p class="uae-block-note">이 조회 화면은 자바스크립트가 필요합니다. 브라우저에서 자바스크립트를 켠 뒤 다시 시도해 주십시오.</p>
        </div>
      </noscript>
    </main>

      <div class="container uae-disclaimer-inner">
        <p id="uae-disclaimer-text"></p>
      </div>
    </div>
  </div>

  <!-- footer 는 .uae-page 밖에 둡니다.
       안에 두면 sticky 인 .uae-disclaimer 가 화면 아래에 붙은 채 footer 를 덮습니다.
       밖으로 빼면 .uae-page 가 끝나는 지점에서 sticky 가 풀려 footer 가 온전히 보입니다. -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <span class="footer-mark">TROPS</span>
        <span class="footer-meta">수출 거래 운영 · contact@theo-ne.com</span>
      </div>

      <nav class="footer-links" aria-label="정책">
        <a href="/precheck">바이어 서류 사전 확인</a>
        <a href="/refund">환불규정</a>
      </nav>

      <dl class="footer-biz" aria-label="사업자정보">
        <div><dt>상호명</dt><dd>주식회사 테오네</dd></div>
        <div><dt>대표자명</dt><dd>범하나</dd></div>
        <div><dt>사업자등록번호</dt><dd>625-81-04032</dd></div>
        <!-- 통신판매업신고 신청 중. 신고번호 확정 시 "신청 중"을 번호로 교체하십시오. -->
        <div><dt>통신판매업신고번호</dt><dd>신청 중</dd></div>
        <div><dt>사업장주소</dt><dd>서울특별시 강남구 봉은사로 524, B층 269-11호(삼성동)</dd></div>
        <div><dt>전화번호</dt><dd>010-2605-5238</dd></div>
      </dl>

      <div class="footer-legal">
        <p>TROPS · 주식회사 테오네 — ※ 법률 자문 서비스가 아닙니다.</p>
        <p>© 2026 TROPS · 주식회사 테오네. All rights reserved.</p>
      </div>
    </div>
  </footer>

<script>
(function () {
  'use strict';

  /* ============================================================
     협정 설정 — 세율 계산에 쓰이는 값은 전부 여기서만 읽습니다.
     다른 협정/국가로 바꿀 때 이 객체만 교체하면 됩니다.
     ============================================================ */
  const UAE_CONFIG = {
    code: 'AE',
    name: '아랍에미리트',
    agreement: '한-UAE CEPA',
    effectiveDate: '2026-05-01',
    tariffAnnex: '부속서 2-가-2',
    psrAnnex: '부속서 3-가',
    staging: {
      B: { steps: 5,  firstYearFactor: 4/5  },
      C: { steps: 10, firstYearFactor: 9/10 },
    },
    roundingDecimals: 1,
  };

  /* 면책 4문장 — 글자 그대로 유지 */
  const FIXED_DISCLAIMER = [
    '이 결과는 한-UAE CEPA 부속서의 양허 내용을 표시한 것입니다.',
    '실제 납부 세액과 다를 수 있습니다.',
    '원산지 결정기준은 품목별로 다르며 원문 확인이 필요합니다.',
    'TROPS는 품목분류·원산지를 판정하지 않습니다.',
  ];

  const DIAGNOSIS_PRICE = '99,000원';
  // 진단서(품목별 확인 항목 문서) 발급 플로우는 아직 열지 않았습니다.
  // 그때까지 비활성 버튼으로 세워두는 대신, 지금 실제로 신청할 수 있는
  // /precheck(바이어 서류 사전 확인)로 보냅니다.
  // 진단서 오픈 시 LABEL 을 '진단서 신청 · ' + DIAGNOSIS_PRICE 로,
  // HREF 를 '/uae/diagnosis?hs=…' 로 되돌리면 됩니다.
  const DIAGNOSIS_CTA_HREF = '/precheck';
  const DIAGNOSIS_CTA_LABEL = '바이어 서류 사전 확인 신청';
  const DIAGNOSIS_CTA_NOTE = '진단서는 준비 중입니다. 바이어가 보낸 서류의 18개 항목 대조는 지금 신청하실 수 있습니다.';
  const PSR_PENDING_TEXT = '원문 확인 중 — 정확한 기준은 담당 관세사에게 문의하십시오';

  /* 허용치(제3.7조)는 세번변경기준을 전제한 항목입니다.
     PSR 원문이 확인되지 않았거나 세번변경 기준이 아닌 품목에는 노출하지 않고,
     기준과 무관한 아래 항목으로 대체합니다. (근거 없는 항목을 만들지 않기 위한 처리) */
  const CTC_PREMISED_PROVISION_IDS = ['tolerance'];
  const CTC_PENDING_SUBSTITUTE = '원산지 판정 근거서류 구비 여부';

  function fetchJson(url, fallback) {
    return fetch(url)
      .then(function (r) { return r.ok ? r.json() : fallback; })
      .catch(function () { return fallback; });
  }

  const $ = (sel, root) => (root || document).querySelector(sel);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const main = $('#uae-main');

  /* ---------- 날짜 ---------- */
  const EFFECTIVE = parseISO(UAE_CONFIG.effectiveDate);
  const TODAY = startOfDay(new Date());

  function parseISO(s) {
    const p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function iso(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function yearMonth(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

  /* ---------- 세율 계산 ---------- */
  // n년차 세율 = 기준세율 × (steps - n) / steps   (n = 1..steps)
  function rateForYear(baseRate, stage, n) {
    if (n <= 0) return baseRate;                       // 발효 전
    if (n >= stage.steps) return 0;
    const factor = n === 1 ? stage.firstYearFactor : (stage.steps - n) / stage.steps;
    return baseRate * factor;
  }

  // 1년차는 발효일부터, 2년차 이후는 각 연도 1월 1일부터
  function startDateForYear(n) {
    if (n <= 1) return EFFECTIVE;
    return new Date(EFFECTIVE.getFullYear() + n - 1, 0, 1);
  }

  // 오늘이 몇 년차인지 (발효 전이면 0)
  function currentYearIndex(stage) {
    if (TODAY < EFFECTIVE) return 0;
    const n = TODAY.getFullYear() - EFFECTIVE.getFullYear() + 1;
    return Math.min(Math.max(n, 1), stage.steps);
  }

  function zeroDateFor(stage) {
    return iso(new Date(EFFECTIVE.getFullYear() + stage.steps - 1, 0, 1));
  }

  function fmtRate(v) {
    const fixed = Number(v).toFixed(UAE_CONFIG.roundingDecimals);
    return String(parseFloat(fixed)) + '%';   // 정수면 소수점 생략
  }

  /* ---------- HS 파싱 ---------- */
  function digitsOnly(s) { return String(s || '').replace(/[^0-9]/g, ''); }

  function hsParts(hs8) {
    // HS 코드는 끝까지 문자열로만 다룹니다 (선행 0 보존 — 01류~09류)
    return { hs8: hs8, hs6: hs8.slice(0, 6), hs4: hs8.slice(0, 4), chapter: hs8.slice(0, 2) };
  }
  function chapterNo(chapter) { return String(parseInt(chapter, 10)); }
  function cleanName(name) { return String(name || '').replace(/^[-\s]+/, '').trim(); }

  /* ---------- 공통 조각 ---------- */
  function topbar() {
    const wrap = el('div', 'container uae-topbar');

    const back = el('a', 'uae-back');
    back.href = '/uae';
    const mark = el('span', 'uae-back-mark', '←');
    mark.setAttribute('aria-hidden', 'true');
    back.appendChild(mark);
    back.appendChild(document.createTextNode('다시 조회'));
    wrap.appendChild(back);

    // nav 워드마크만으로는 홈 경로가 잘 읽히지 않아 텍스트 링크를 함께 둡니다.
    const home = el('a', 'uae-back', '홈');
    home.href = '/';
    wrap.appendChild(home);

    return wrap;
  }

  function lookupForm(labelText, presetValue) {
    const box = el('div', 'hs-box');
    box.appendChild(el('p', 'hs-box-label', labelText || 'HS 코드로 협정 세율 조회'));

    const form = el('form', 'hs-group');
    form.action = '/uae';
    form.method = 'get';
    form.appendChild(el('span', 'hs-country', UAE_CONFIG.name));

    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'hs-input';
    input.name = 'hs';
    input.inputMode = 'numeric';
    input.pattern = '[0-9]{8}';
    input.maxLength = 8;
    input.placeholder = 'HS 8단위 입력';
    input.title = 'HS 코드 8자리 숫자를 입력하세요';
    input.required = true;
    input.setAttribute('aria-label', 'HS 코드 8단위');
    if (presetValue) input.value = presetValue;
    form.appendChild(input);

    const btn = el('button', 'btn btn-primary', '확인');
    btn.type = 'submit';
    form.appendChild(btn);

    box.appendChild(form);
    box.appendChild(el('p', 'hs-meta',
      UAE_CONFIG.name + ' · ' + UAE_CONFIG.agreement + ' 기준 · 무료 · 로그인 없이 조회'));
    return box;
  }

  function badge(text, extraClass) {
    return el('span', 'wf-badge' + (extraClass ? ' ' + extraClass : ''), text);
  }

  function rateCard(label, value, src, opts) {
    const o = opts || {};
    const card = el('div', 'uae-rate' + (o.now ? ' uae-rate-now' : ''));
    const lab = el('div', 'uae-rate-label');
    lab.appendChild(document.createTextNode(label));
    if (o.labelBadge) lab.appendChild(badge(o.labelBadge, 'uae-badge-quiet'));
    card.appendChild(lab);
    card.appendChild(el('p', 'uae-rate-value' + (o.na ? ' uae-rate-value-na' : ''), value));
    card.appendChild(el('p', 'uae-rate-src', src));
    return card;
  }

  function blockHead(section, title, srcText) {
    const head = el('div', 'uae-block-head');
    head.appendChild(el('h2', 'uae-block-title', title));
    if (srcText) head.appendChild(el('span', 'uae-block-src', srcText));
    section.appendChild(head);
  }

  /* ---------- 확인 항목 파생 ----------
     분기 근거는 두 가지뿐입니다: (1) 트랙, (2) PSR 원문 확인 여부.
     개수는 배열 길이에서만 나옵니다. */
  function buildCheckItems(record, psr, provisions, trackItems) {
    const items = [];

    // (1) 트랙 기반 — 확인된 데이터
    const byTrack = (trackItems && trackItems[record.concession]) || [];
    byTrack.forEach((it) => items.push(it.title));

    const verified = !!(psr && psr.verified);
    const psrRuleText = verified ? [psr.rule, psr.alternative].filter(Boolean).join(' ') : '';
    const isCtcRule = /세번변경/.test(psrRuleText);

    // (2) PSR 원문이 확인된 품목에만 기준 기반 항목을 만듭니다
    const psrDerived = [];
    if (verified) {
      if (psr.rule) psrDerived.push(psr.rule + ' 충족 여부');
      if (psr.alternative) psrDerived.push(psr.alternative + ' 산정 근거');
    }

    // (3) 협정 일반 조항 — data/general-provisions.json 순서 유지
    let psrPlaced = false;
    provisions.forEach((p) => {
      if (CTC_PREMISED_PROVISION_IDS.indexOf(p.id) === -1) {
        items.push(p.title);
        return;
      }
      // 허용치 자리
      if (verified && isCtcRule) items.push(p.title);
      else if (!verified) items.push(CTC_PENDING_SUBSTITUTE);
      // 확인됐지만 세번변경 기준이 아니면 허용치 항목을 넣지 않습니다.
      if (psrDerived.length) {
        psrDerived.forEach((t) => items.push(t));
        psrPlaced = true;
      }
    });
    if (psrDerived.length && !psrPlaced) psrDerived.forEach((t) => items.push(t));

    return items;
  }

  /* ---------- 결과 렌더 ---------- */
  function renderResult(record, psr, provisions, trackItems, chapterNames) {
    const parts = hsParts(record.hs8);
    const conc = record.concession;
    const stage = UAE_CONFIG.staging[conc] || null;
    const isStaged = !!stage;                       // B / C
    const isImmediate = conc === 'A';
    const isExcluded = conc === 'X';
    const noRate = conc === 'PH' || conc === 'SG';  // 세율을 표시하지 않는 유형
    const frag = document.createDocumentFragment();

    frag.appendChild(topbar());

    /* 1. 헤더 */
    const head = el('header', 'container uae-head');
    head.appendChild(el('p', 'uae-head-kicker', UAE_CONFIG.name + ' · ' + UAE_CONFIG.agreement));
    const hs = el('div', 'uae-hs');
    hs.appendChild(el('span', 'uae-hs-g', parts.hs8.slice(0, 4)));
    hs.appendChild(el('span', 'uae-hs-g', parts.hs8.slice(4)));
    head.appendChild(hs);
    head.appendChild(el('p', 'uae-hs-note',
      'HS 8단위 · 6단위 ' + parts.hs6 + ' · 제' + parts.hs4 + '호'));
    head.appendChild(el('h1', 'uae-item-name', cleanName(record.name)));
    // 류 이름은 data/chapter_names.json 에서 옵니다.
    // 관세청 속견표 기준 약칭이며(일부는 협정문 원문 정식 명칭), 어느 류인지 알아보게 돕는
    // 안내용 표기입니다. 법적 인용이나 품목분류 근거로 쓸 수 있는 문구가 아닙니다.
    // 이름이 없는 류(예: 제98류)는 "제N류"만 표시하고 지어내지 않습니다.
    const chapterName = (chapterNames && chapterNames[parts.chapter]) ||
      (psr && psr.chapterName) || '';
    head.appendChild(el('p', 'uae-item-parent',
      '제' + chapterNo(parts.chapter) + '류' + (chapterName ? ' · ' + chapterName : '')));

    const badges = el('div', 'uae-badge-row');
    badges.appendChild(badge(record.trackLabel, conc === 'PH' ? 'uae-badge-warning' : null));
    badges.appendChild(badge('양허유형 ' + conc, 'uae-badge-quiet'));
    badges.appendChild(badge(UAE_CONFIG.tariffAnnex, 'uae-badge-quiet'));
    head.appendChild(badges);
    frag.appendChild(head);

    /* 2. 세율 카드 3개 */
    const ratesWrap = el('div', 'container');
    const rates = el('div', 'uae-rates');
    const nowBadge = yearMonth(TODAY) + ' 기준';
    const yearIndex = isStaged ? currentYearIndex(stage) : 0;

    if (noRate) {
      rates.appendChild(rateCard('기준세율', '해당없음',
        UAE_CONFIG.tariffAnnex + ' 기재값: ' + record.baseRateRaw + '. 세율로 환산하지 않습니다.',
        { na: true }));
      rates.appendChild(rateCard('현재 세율', '해당없음',
        record.trackLabel + '으로 기재되어 단계별 철폐 일정이 없습니다.',
        { now: true, na: true, labelBadge: nowBadge }));
      rates.appendChild(rateCard('무관세 도달일', '해당없음',
        record.trackLabel + ' — ' + UAE_CONFIG.tariffAnnex + '에 철폐 일정이 기재되지 않았습니다.',
        { na: true }));
    } else {
      rates.appendChild(rateCard('기준세율', record.baseRateRaw,
        isExcluded
          ? 'UAE 양허표 기재 기준세율. 협정과 무관하게 유지됩니다.'
          : 'UAE 양허표 기재 기준세율. 발효 전 실행관세율입니다.'));

      if (isImmediate) {
        rates.appendChild(rateCard('현재 세율', fmtRate(0),
          '발효일에 전량 철폐되는 유형입니다. 이후 단계 인하가 없습니다.',
          { now: true, labelBadge: nowBadge }));
        rates.appendChild(rateCard('무관세 도달일', UAE_CONFIG.effectiveDate,
          '협정 발효일. ' + UAE_CONFIG.tariffAnnex + ' 양허유형 A.'));
      } else if (isStaged) {
        const cur = rateForYear(record.baseRate, stage, yearIndex);
        const from = startDateForYear(yearIndex);
        const until = yearIndex >= stage.steps
          ? null
          : new Date(startDateForYear(yearIndex + 1).getTime() - 86400000);
        const srcNow = yearIndex === 0
          ? '협정 발효(' + UAE_CONFIG.effectiveDate + ') 전이므로 기준세율이 적용됩니다.'
          : yearIndex >= stage.steps
            ? '철폐 완료. ' + zeroDateFor(stage) + '부터 무관세입니다.'
            : yearIndex + '년차(' + iso(from) + ' ~ ' + iso(until) + ') 적용분. 매년 1월 1일 인하됩니다.';
        rates.appendChild(rateCard('현재 세율', fmtRate(yearIndex === 0 ? record.baseRate : cur),
          srcNow, { now: true, labelBadge: nowBadge }));
        rates.appendChild(rateCard('무관세 도달일', zeroDateFor(stage),
          stage.steps + '회 균등 인하 후 철폐. ' + UAE_CONFIG.tariffAnnex + ' 양허유형 ' + conc + '.'));
      } else { // X
        rates.appendChild(rateCard('현재 세율', record.baseRateRaw,
          '양허 대상이 아니므로 인하 일정이 없습니다.',
          { now: true, labelBadge: nowBadge }));
        rates.appendChild(rateCard('무관세 도달일', '해당없음',
          '양허제외 품목 — ' + UAE_CONFIG.tariffAnnex + '에 철폐 일정이 기재되지 않았습니다.',
          { na: true }));
      }
    }
    ratesWrap.appendChild(rates);
    frag.appendChild(ratesWrap);

    /* 3. 연도별 세율 표 — B/C에서만 표를 그립니다 */
    if (isStaged) {
      const sec = el('section', 'container uae-block');
      blockHead(sec, '연도별 적용 세율', UAE_CONFIG.tariffAnnex + ' 단계별 철폐 일정 · 균등 인하');
      sec.appendChild(el('p', 'uae-block-note',
        '각 세율은 해당 연도 1월 1일부터 적용됩니다. 1년차는 발효일부터 적용됩니다.'));

      const wrap = el('div', 'uae-table-wrap');
      const table = el('table', 'uae-table');
      const thead = el('thead');
      const htr = el('tr');
      const th1 = el('th', null, '적용 시점'); th1.scope = 'col';
      const th2 = el('th', null, '세율'); th2.scope = 'col';
      htr.appendChild(th1); htr.appendChild(th2);
      thead.appendChild(htr);
      table.appendChild(thead);

      const tbody = el('tbody');
      for (let n = 1; n <= stage.steps; n++) {
        const tr = el('tr', n === yearIndex ? 'uae-row-current' : null);
        const tdDate = el('td', null, iso(startDateForYear(n)));
        let mark = null;
        if (n === 1 && yearIndex === 1) mark = '발효 · 현재';
        else if (n === 1) mark = '발효';
        else if (n === yearIndex) mark = '현재';
        else if (n === stage.steps) mark = '무관세';
        if (mark) tdDate.appendChild(el('span', 'uae-row-mark', mark));
        tr.appendChild(tdDate);
        tr.appendChild(el('td', null, fmtRate(rateForYear(record.baseRate, stage, n))));
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      sec.appendChild(wrap);
      frag.appendChild(sec);
    } else if (!isImmediate) {
      // X / PH / SG — 제목과 설명만, 표 없음
      const sec = el('section', 'container uae-block');
      blockHead(sec, '연도별 적용 세율', UAE_CONFIG.tariffAnnex + ' 단계별 철폐 일정');
      sec.appendChild(el('p', 'uae-block-note',
        '양허제외·금지품목·특별관심품목은 단계별 철폐 일정이 없습니다. 표시할 연도별 세율이 없습니다.'));
      frag.appendChild(sec);
    }
    // A(즉시 철폐)는 이 블록을 DOM에 만들지 않습니다.

    /* 4. PSR */
    const verified = !!(psr && psr.verified);
    const psrSec = el('section', 'container uae-block');
    blockHead(psrSec, '원산지 결정기준(PSR)', UAE_CONFIG.psrAnnex + ' 품목별 원산지 기준');
    const psrBox = el('div', 'uae-psr' + (verified ? '' : ' uae-psr-pending'));
    const state = el('div', 'uae-psr-state');
    const markEl = el('i', 'uae-psr-mark' + (verified ? '' : ' uae-psr-mark-pending'));
    markEl.setAttribute('aria-hidden', 'true');
    state.appendChild(markEl);
    state.appendChild(document.createTextNode(verified ? '원문 확인됨' : '원문 확인 중'));
    psrBox.appendChild(state);

    if (verified) {
      const ruleText = [psr.rule, psr.alternative].filter(Boolean).join(' 또는 ');
      psrBox.appendChild(el('p', 'uae-psr-text', ruleText));
      // 출처 문구는 확인된 품목에만 붙입니다. 데이터가 류 단위이므로 류 단위로만 표기합니다.
      psrBox.appendChild(el('p', 'uae-psr-meta',
        psr.source + ' 기재 기준을 그대로 옮긴 것입니다. 충족 여부 판정은 포함되지 않습니다.'));
    } else {
      psrBox.appendChild(el('p', 'uae-psr-text uae-psr-text-pending', PSR_PENDING_TEXT));
      psrBox.appendChild(el('p', 'uae-psr-meta',
        '제' + chapterNo(parts.chapter) + '류는 ' + UAE_CONFIG.psrAnnex +
        ' 원문 확인이 완료되지 않았습니다. TROPS는 확인된 원문만 표시하며, 추정하지 않습니다.'));
    }
    psrSec.appendChild(psrBox);
    frag.appendChild(psrSec);

    /* 5. 확인 항목 */
    const items = buildCheckItems(record, psr, provisions, trackItems);
    const checkSec = el('section', 'container uae-check');
    checkSec.appendChild(el('p', 'uae-check-count',
      '확인이 필요한 항목이 ' + items.length + '개 있습니다'));
    checkSec.appendChild(el('p', 'uae-check-sub',
      '원산지증명서 · 소급발급 기한 등 협정상 확인 대상입니다.'));
    const list = el('ul', 'uae-check-list');
    items.forEach((title, i) => {
      const li = el('li', 'uae-check-item');
      li.appendChild(el('span', 'uae-check-num', String(i + 1).padStart(2, '0')));
      li.appendChild(el('span', null, title));
      list.appendChild(li);
    });
    checkSec.appendChild(list);

    const cta = el('div', 'uae-check-cta');
    // 진단서 신청 플로우(/uae/diagnosis)는 아직 없습니다.
    // 그동안 이 자리는 지금 신청 가능한 /precheck 로 연결합니다.
    const ctaBtn = el('a', 'btn btn-primary', DIAGNOSIS_CTA_LABEL);
    ctaBtn.href = DIAGNOSIS_CTA_HREF;
    cta.appendChild(ctaBtn);
    cta.appendChild(el('p', 'uae-check-cta-note', DIAGNOSIS_CTA_NOTE));
    checkSec.appendChild(cta);
    frag.appendChild(checkSec);

    main.innerHTML = '';
    main.appendChild(frag);
    document.title = parts.hs8 + ' · ' + UAE_CONFIG.agreement + ' 협정 세율 — TROPS';

    logLookup(parts.hs8, conc, verified);
  }

  /* ---------- 결과 없음 ---------- */
  function renderNotFound(hs8, siblings) {
    const parts = hsParts(hs8);
    const frag = document.createDocumentFragment();
    frag.appendChild(topbar());

    const head = el('header', 'container uae-head');
    head.appendChild(el('p', 'uae-head-kicker', UAE_CONFIG.name + ' · ' + UAE_CONFIG.agreement));
    const hs = el('div', 'uae-hs');
    hs.appendChild(el('span', 'uae-hs-g', parts.hs8.slice(0, 4)));
    hs.appendChild(el('span', 'uae-hs-g', parts.hs8.slice(4)));
    head.appendChild(hs);
    head.appendChild(el('p', 'uae-hs-note',
      'HS 8단위 · 6단위 ' + parts.hs6 + ' · 제' + parts.hs4 + '호'));
    head.appendChild(el('h1', 'uae-item-name', '양허표에서 찾을 수 없는 HS 8단위입니다'));
    head.appendChild(el('p', 'uae-item-parent',
      UAE_CONFIG.tariffAnnex + '에 이 8단위 코드가 기재되어 있지 않습니다.'));
    frag.appendChild(head);

    const sec = el('section', 'container uae-block');
    sec.style.borderTop = '0';
    if (siblings && siblings.length) {
      blockHead(sec, '제' + parts.hs4 + '호에 기재된 8단위',
        UAE_CONFIG.tariffAnnex + ' 기재 항목 ' + siblings.length + '건');
      sec.appendChild(el('p', 'uae-block-note',
        '입력하신 코드와 같은 4단위 호에 기재된 항목입니다. TROPS는 어느 항목에 해당하는지 추정하지 않습니다. 품목분류는 직접 확인하시거나 담당 관세사에게 문의하십시오.'));
      const wrap = el('div', 'uae-table-wrap');
      const table = el('table', 'uae-table');
      const thead = el('thead');
      const htr = el('tr');
      const th1 = el('th', null, 'HS 8단위'); th1.scope = 'col';
      const th2 = el('th', null, '품목명'); th2.scope = 'col';
      htr.appendChild(th1); htr.appendChild(th2);
      thead.appendChild(htr);
      table.appendChild(thead);
      const tbody = el('tbody');
      siblings.forEach((r) => {
        const tr = el('tr');
        const tdCode = el('td');
        const a = el('a', null, r.hs8);
        a.href = '/uae?hs=' + encodeURIComponent(r.hs8);
        tdCode.appendChild(a);
        tr.appendChild(tdCode);
        tr.appendChild(el('td', null, cleanName(r.name)));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      sec.appendChild(wrap);
    } else {
      blockHead(sec, '제' + parts.hs4 + '호에 기재된 8단위', UAE_CONFIG.tariffAnnex);
      sec.appendChild(el('p', 'uae-block-note',
        '제' + parts.hs4 + '호로 시작하는 항목도 양허표에 기재되어 있지 않습니다. 상위 4단위(' +
        parts.hs4 + ') 기준으로 품목분류를 다시 확인해 주십시오. TROPS는 해당 품목의 세율을 추정하지 않습니다.'));
    }
    frag.appendChild(sec);

    const again = el('section', 'container uae-block');
    again.appendChild(lookupForm('다른 HS 코드로 조회', ''));
    frag.appendChild(again);

    main.innerHTML = '';
    main.appendChild(frag);
    document.title = parts.hs8 + ' · 조회 결과 없음 — TROPS';
  }

  /* ---------- 입력 폼 / 안내 ---------- */
  function renderForm(noticeText) {
    const frag = document.createDocumentFragment();
    const head = el('header', 'container uae-head');
    head.appendChild(el('p', 'uae-head-kicker', UAE_CONFIG.name + ' · ' + UAE_CONFIG.agreement));
    head.appendChild(el('h1', 'uae-item-name', 'HS 코드로 협정 세율 조회'));
    head.appendChild(el('p', 'uae-item-parent',
      'HS 8단위를 입력하면 ' + UAE_CONFIG.tariffAnnex + '의 양허 내용과 연도별 적용 세율을 보여드립니다.'));
    if (noticeText) {
      const note = el('p', 'uae-block-note', noticeText);
      note.style.marginTop = '18px';
      head.appendChild(note);
    }
    head.appendChild(lookupForm('HS 코드로 협정 세율 조회', ''));
    frag.appendChild(head);

    main.innerHTML = '';
    main.appendChild(frag);
    const input = $('#hs-input');
    if (input) input.focus();
  }

  /* ---------- 조회 로그 (fire-and-forget) ---------- */
  function logLookup(hs8, resultTrack, psrVerified) {
    try {
      fetch('/api/lookup-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          hs8: hs8,
          country: UAE_CONFIG.code,
          resultTrack: resultTrack,
          psrVerified: !!psrVerified,
          timestamp: new Date().toISOString(),
        }),
        keepalive: true,
      }).catch(function () { /* 로그 실패는 조회를 막지 않습니다 */ });
    } catch (e) { /* 무시 */ }
  }

  /* ---------- 부트스트랩 ---------- */
  $('#uae-disclaimer-text').textContent = FIXED_DISCLAIMER.join(' ');

  const raw = new URLSearchParams(location.search).get('hs');
  const hs8 = digitsOnly(raw);

  if (!raw) {
    renderForm('');
  } else if (hs8.length !== 8) {
    renderForm('HS 8단위(숫자 8자리)를 입력해 주십시오. 입력하신 값: ' + raw);
  } else {
    const chapter = hs8.slice(0, 2);
    Promise.all([
      fetchJson('/data/tariff/' + chapter + '.json', null),
      fetchJson('/data/psr.json', {}),
      fetchJson('/data/general-provisions.json', []),
      fetchJson('/data/check-items-by-track.json', {}),
      fetchJson('/data/chapter_names.json', {}),
    ]).then(function (res) {
      const rows = res[0];
      const psrAll = res[1] || {};
      const provisions = res[2] || [];
      const trackItems = res[3] || {};
      const chapterNames = res[4] || {};

      if (!Array.isArray(rows)) { renderNotFound(hs8, []); return; }

      // 문자열 정확 일치 — 숫자로 변환하지 않습니다 (01류~09류 선행 0 보존)
      let record = null;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i].hs8 === hs8) { record = rows[i]; break; }
      }

      if (!record) {
        const hs4 = hs8.slice(0, 4);
        const siblings = rows.filter(function (r) { return r.hs8.slice(0, 4) === hs4; });
        renderNotFound(hs8, siblings);
        return;
      }

      renderResult(record, psrAll[chapter] || null, provisions, trackItems, chapterNames);
    }).catch(function () {
      renderForm('조회 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주십시오.');
    });
  }
})();
</script>
</body>
</html>
